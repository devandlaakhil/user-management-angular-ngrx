<div class="users-container">
  <div class="header">
    <h2>Users</h2>
    <button (click)="addUser()">
      Add User
    </button>
  </div>
  @if (loading$ | async) {
    <p>Loading...</p>
  }
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (user of users$ | async; track user.id) {
        <tr>
          <td>
            {{ user.id }}
          </td>
          <td>
            {{ user.name }}
          </td>
          <td>
            {{ user.email }}
          </td>
          <td>
            {{ user.role }}
          </td>
          <td>
            <button (click)="editUser(user)">
              Edit
            </button>
            <button
              (click)="deleteUser(user.id)"
            >
              Delete
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
