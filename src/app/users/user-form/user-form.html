<div class="form-page">
  <div class="form-card">
    <h2>
      {{ isEditMode ? 'Edit User' : 'Add User' }}
    </h2>
    <form [formGroup]="userForm" (ngSubmit)="submit()">
      <!-- Name -->
      <div class="form-group">
        <label> Name </label>
        <input type="text" formControlName="name" placeholder="Enter user name">
        @if ( userForm.controls.name.touched && userForm.controls.name.invalid) {
          <small> Name is required and must contain at least 3 characters.</small>
        }
      </div>
      <!-- Email -->
      <div class="form-group">
        <label> Email </label>
        <input type="email" formControlName="email" placeholder="Enter email">
        @if ( userForm.controls.email.touched && userForm.controls.email.invalid) {
          <small> Please enter a valid email. </small>
        }
      </div>
      <!-- Role -->
      <div class="form-group">
        <label> Role </label>
        <select formControlName="role">
          <option value="Admin"> Admin </option>
          <option value="User"> User </option>
          <option value="Editor"> Editor </option>
        </select>
      </div>

      <!-- Buttons -->
      <div class="form-actions">
        <button type="button" class="cancel-btn" (click)="cancel()">
          Cancel
        </button>
        <button type="submit" class="save-btn">
          {{ isEditMode ? 'Update User' : 'Add User' }}
        </button>
      </div>
    </form>
  </div>
</div>
